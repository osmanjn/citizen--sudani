
name: Build Android APK

on:
  push:
    paths:
      - '.github/workflows/android.yml'
      - 'index.html'
      - 'غلاف المواطن السوداني_ وجع وأمل.png'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get project files
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK and accept licenses
        shell: bash
        run: |
          set -e
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Create Android app
        shell: bash
        run: |
          set -e
          mkdir -p app/src/main/assets
          mkdir -p app/src/main/java/com/osmanjana/citizensudani

          cp index.html app/src/main/assets/index.html
          cp 'غلاف المواطن السوداني_ وجع وأمل.png' app/src/main/assets/cover.png

          cat > app/src/main/assets/cover.html <<'HTML'
          <!doctype html>
          <html lang="ar" dir="rtl">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <title>المواطن السوداني - وجع وأمل</title>
            <style>
              * { box-sizing: border-box; }
              body {
                margin: 0;
                min-height: 100vh;
                padding: 20px;
                display: flex;
                align-items: center;
                justify-content: center;
                text-align: center;
                font-family: sans-serif;
                color: white;
                background: linear-gradient(160deg,#102e24,#176b45,#071b15);
              }
              main { width: 100%; max-width: 440px; }
              img {
                display: block;
                width: 100%;
                max-height: 65vh;
                object-fit: contain;
                border-radius: 14px;
                margin: 0 auto 18px;
              }
              h1 { font-size: 26px; margin: 12px 0; }
              p { font-size: 17px; line-height: 1.8; }
              button {
                width: 100%;
                padding: 16px;
                margin-top: 12px;
                border: 0;
                border-radius: 12px;
                background: #f2d16b;
                color: #173b2b;
                font-size: 20px;
                font-weight: bold;
              }
            </style>
          </head>
          <body>
            <main>
              <img src="cover.png" alt="غلاف المواطن السوداني - وجع وأمل">
              <h1>المواطن السوداني</h1>
              <p>وجع وأمل — تأليف عثمان جنا</p>
              <button onclick="location.href='index.html'">ابدأ القراءة</button>
            </main>
          </body>
          </html>
          HTML

          cat > settings.gradle <<'GRADLE'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = 'CitizenSudani'
          include ':app'
          GRADLE

          cat > build.gradle <<'GRADLE'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          GRADLE

          cat > gradle.properties <<'GRADLE'
          android.useAndroidX=true
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          GRADLE

          cat > app/build.gradle <<'GRADLE'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.osmanjana.citizensudani'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.osmanjana.citizensudani'
                  minSdk 23
                  targetSdk 35
                  versionCode 2
                  versionName '1.1'
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          GRADLE

          cat > app/src/main/AndroidManifest.xml <<'XML'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:allowBackup="true"
                  android:label="المواطن السوداني"
                  android:supportsRtl="true"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          XML

          cat > app/src/main/java/com/osmanjana/citizensudani/MainActivity.java <<'JAVA'
          package com.osmanjana.citizensudani;

          import android.app.Activity;
          import android.os.Bundle;
          import android.graphics.Color;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          public class MainActivity extends Activity {
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  getWindow().setStatusBarColor(Color.rgb(23, 107, 69));

                  WebView webView = new WebView(this);
                  setContentView(webView);
                  webView.setWebViewClient(new WebViewClient());
                  webView.getSettings().setJavaScriptEnabled(true);
                  webView.getSettings().setDomStorageEnabled(true);
                  webView.loadUrl("file:///android_asset/cover.html");
              }
          }
          JAVA

      - name: Build APK
        run: gradle --no-daemon assembleDebug

      - name: Save APK for download
        uses: actions/upload-artifact@v4
        with:
          name: citizen-sudani-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
